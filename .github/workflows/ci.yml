name: CI

# Runs on every push and pull request so regressions are caught before a
# release tag is ever pushed (see release.yml for the tag-triggered build).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: PHP lint
        run: |
          php_bin=$(command -v php)
          find . -name "*.php" -not -path "./node_modules/*" -print0 | xargs -0 -n1 "$php_bin" -l

      - name: JS lint
        run: npm run lint:js

      - name: CSS lint
        run: npm run lint:css

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
